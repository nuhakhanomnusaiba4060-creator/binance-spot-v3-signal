
name: Binance Spot V3 Smart Signal Scanner

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test mode (no Telegram signals or history updates)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: binance-spot-v3-scanner
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DRY_RUN: ${{ github.event_name == 'schedule' && 'true' || inputs.dry_run }}
      SCANNER_CAPITAL_USDT: ${{ vars.SCANNER_CAPITAL_USDT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run system tests
        run: |
          python -m unittest test_system -v

      - name: Run Binance Spot V3 Scanner
        run: |
          python scanner.py

      - name: Persist signal history
        if: ${{ env.DRY_RUN == 'false' && success() }}
        run: |
          if [ -f signal_history.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add -f signal_history.json

            if ! git diff --cached --quiet; then
              git commit -m "Update V3 signal history"
              git push
            fi
          fi
