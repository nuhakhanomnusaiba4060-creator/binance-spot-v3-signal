
name: Binance Spot V3 Smart Signal Scanner

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test mode (no Telegram signals or history updates)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

# Shared group: prevents concurrent writes to main
# with the Analytics workflow.
concurrency:
  group: v3-main-branch-writes
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      SCANNER_CAPITAL_USDT: ${{ vars.SCANNER_CAPITAL_USDT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run system tests
        run: |
          python -m unittest test_system -v

      - name: Run Binance Spot V3 Scanner
        run: |
          python scanner.py

      - name: Persist signal history safely
        if: ${{ env.DRY_RUN == 'false' && success() }}
        shell: bash
        run: |
          set -e

          if [ ! -f signal_history.json ]; then
            echo "No signal_history.json found. Nothing to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f signal_history.json

          if git diff --cached --quiet; then
            echo "No signal history changes."
            exit 0
          fi

          git commit -m "Update V3 signal history"

          # Fetch and rebase before every push attempt.
          # Never force-push or overwrite remote history.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt: ${attempt}"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "ERROR: Rebase conflict detected."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Signal history pushed successfully."
              exit 0
            fi

            echo "Push rejected. Retrying safely..."
            sleep $((attempt * 2))
          done

          echo "ERROR: Push failed after 5 attempts."
          exit 1
