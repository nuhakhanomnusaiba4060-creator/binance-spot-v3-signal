
name: V3 Signal Performance Analytics

on:
  # Run after scanner updates signal history.
  push:
    branches:
      - main
    paths:
      - "signal_history.json"
      - "signal_analytics.py"
      - ".github/workflows/signal_analytics.yml"

  # Backup schedule: every 15 minutes.
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

# Shared with the scanner workflow.
# Prevents simultaneous writes to main.
concurrency:
  group: v3-main-branch-writes
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Signal Analytics
        run: |
          python signal_analytics.py

      - name: Persist Analytics Data Safely
        if: success()
        shell: bash
        run: |
          set -e

          if [ ! -f signal_analytics.json ]; then
            echo "ERROR: signal_analytics.json was not created."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f signal_analytics.json

          if git diff --cached --quiet; then
            echo "No analytics changes."
            exit 0
          fi

          git commit -m "Update V3 signal analytics"

          # Safely synchronize with remote main.
          # Never overwrite remote commits.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt: ${attempt}"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "ERROR: Rebase conflict detected."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Analytics data pushed successfully."
              exit 0
            fi

            echo "Push rejected. Retrying safely..."
            sleep $((attempt * 2))
          done

          echo "ERROR: Analytics push failed after 5 attempts."
          exit 1
