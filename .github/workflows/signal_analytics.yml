
name: V3 Signal Performance Analytics

on:
  # Run shortly after the scanner persists new signal history.
  push:
    paths:
      - "signal_history.json"
      - "signal_analytics.py"
      - ".github/workflows/signal_analytics.yml"

  # Backup schedule.
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v3-signal-analytics
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Signal Analytics
        run: python signal_analytics.py

      - name: Persist Analytics Data
        if: success()
        run: |
          if [ ! -f signal_analytics.json ]; then
            echo "ERROR: signal_analytics.json was not created."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f signal_analytics.json

          if git diff --cached --quiet; then
            echo "No analytics changes."
            exit 0
          fi

          git commit -m "Update V3 signal analytics"

          # Preserve concurrent scanner history commits.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
