File: ".github/workflows/signal_analytics.yml"

name: V3 Signal Performance Analytics

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v3-signal-analytics
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Signal Analytics
        run: |
          python signal_analytics.py

      - name: Persist Analytics Data
        if: success()
        run: |
          if [ -f signal_analytics.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add -f signal_analytics.json

            if ! git diff --cached --quiet; then
              git commit -m "Update V3 signal analytics"
              git pull --rebase --autostash origin main
              git push origin main
            else
              echo "No analytics changes."
            fi
          fi
