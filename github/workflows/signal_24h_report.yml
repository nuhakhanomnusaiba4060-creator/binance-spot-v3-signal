
name: V3 Daily 24H Signal Report

on:
  schedule:
    # Every day at 18:05 UTC = 00:05 Bangladesh time
    - cron: "5 18 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-daily-24h-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.31.0,<3.0.0"

      - name: Validate required files
        run: |
          test -f signal_24h_report.py
          test -f signal_analytics.json
          test -f signal_history.json

      - name: Send 24-hour Telegram report
        run: python signal_24h_report.py
